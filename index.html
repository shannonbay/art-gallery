<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shannon Bay — Art Gallery</title>
  <meta name="description" content="Drawings and paintings by Shannon Bay, in pencil, charcoal, crayon, ink and watercolour.">
  <meta property="og:title" content="Shannon Bay — Art Gallery">
  <meta property="og:description" content="Drawings and paintings in pencil, charcoal, crayon, ink and watercolour.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shannonbay.github.io/art-gallery/">
  <meta property="og:image" content="https://shannonbay.github.io/art-gallery/images/full/flowing-forms.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4efe6'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%232b2723' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23b4472e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">Art Gallery</p>
    <h1>Shannon Bay</h1>
    <p class="intro">Drawings and paintings in pencil, charcoal, crayon, ink and watercolour.</p>
  </header>

  <main class="wall">
    <figure class="work">
      <a href="images/full/flowing-forms.jpg"><img src="images/thumb/flowing-forms.jpg" width="720" height="484" alt="Abstract network of black ink lines joining rounded, banded shapes in green, red, blue and gold."></a>
      <figcaption><cite>Flowing Forms</cite><span>Ink and coloured pencil</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/lion-in-the-wind.jpg"><img src="images/thumb/lion-in-the-wind.jpg" width="511" height="720" loading="lazy" alt="Pencil drawing of a standing lion in profile, its heavy mane blown by the wind."></a>
      <figcaption><cite>Lion in the Wind</cite><span>Pencil</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/kakariki.jpg"><img src="images/thumb/kakariki.jpg" width="699" height="590" loading="lazy" alt="Bright green parakeet with a red crown perched on a twig, drawn on lined notepaper."></a>
      <figcaption><cite>Kākāriki</cite><span>Coloured pencil on notepaper</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/downcast-smile.jpg"><img src="images/thumb/downcast-smile.jpg" width="518" height="720" loading="lazy" alt="Charcoal portrait of a smiling child with loose curls, looking down."></a>
      <figcaption><cite>Downcast Smile</cite><span>Charcoal</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/golden-afternoon.jpg"><img src="images/thumb/golden-afternoon.jpg" width="720" height="511" loading="lazy" alt="Soft painting of a golden retriever resting in bright green grass."></a>
      <figcaption><cite>Golden Afternoon</cite><span>Paint on paper</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/colour-study.jpg"><img src="images/thumb/colour-study.jpg" width="534" height="720" loading="lazy" alt="Portrait of a man's face in three-quarter view, built from vivid strokes of orange, yellow, blue and pink crayon."></a>
      <figcaption><cite>Colour Study</cite><span>Crayon</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/kereru-and-nikau.jpg"><img src="images/thumb/kereru-and-nikau.jpg" width="720" height="490" loading="lazy" alt="Watercolour of a green native pigeon on a branch beside a nīkau palm."></a>
      <figcaption><cite>Kererū and Nīkau</cite><span>Watercolour</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/sideways-glance.jpg"><img src="images/thumb/sideways-glance.jpg" width="511" height="720" loading="lazy" alt="Pencil portrait of a man with swept-back hair, head tilted, glancing sideways."></a>
      <figcaption><cite>Sideways Glance</cite><span>Pencil</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/bowl-of-fruit.jpg"><img src="images/thumb/bowl-of-fruit.jpg" width="720" height="655" loading="lazy" alt="Still life of apples and green pears piled in a blue bowl."></a>
      <figcaption><cite>Bowl of Fruit</cite><span>Coloured pencil</span></figcaption>
    </figure>
    <figure class="work">
      <a href="images/full/purple-hair.jpg"><img src="images/thumb/purple-hair.jpg" width="455" height="720" loading="lazy" alt="Loose crayon sketch of a child with purple and orange hair above a tangle of blue scribbles."></a>
      <figcaption><cite>Purple Hair</cite><span>Crayon</span></figcaption>
    </figure>
  </main>

  <footer class="colophon">
    <p>© 2026 Shannon Bay. All rights reserved.</p>
  </footer>

  <dialog class="viewer" aria-label="Artwork viewer">
    <button class="viewer-close" type="button" aria-label="Close">×</button>
    <img class="viewer-image" alt="">
    <div class="viewer-bar">
      <button class="viewer-prev" type="button" aria-label="Previous artwork">←</button>
      <p class="viewer-caption" aria-live="polite"></p>
      <button class="viewer-next" type="button" aria-label="Next artwork">→</button>
    </div>
  </dialog>

  <script src="gallery.js"></script>
</body>
</html>
